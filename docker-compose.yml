services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.2'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.2/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - './docker/laravel-custom.ini:/etc/php/8.2/cli/conf.d/99-sail.ini'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            mailpit:
                condition: service_started
    # Queue worker service for background job processing (large exports, etc.)
    # In production, this is handled by Supervisor instead of Docker
    queue:
        build:
            context: './vendor/laravel/sail/runtimes/8.2'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.2/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - './docker/laravel-custom.ini:/etc/php/8.2/cli/conf.d/99-sail.ini'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
        # Wait for mysql to be reachable before starting the worker. depends_on:service_healthy
        # only gates the initial `up`; with restart:unless-stopped the worker is otherwise
        # resurrected while mysql is down (laptop sleep/reboot/`sail down`), where it would spam
        # "getaddrinfo for mysql failed" stack traces into laravel.log every --sleep seconds.
        command: "bash -c 'until (echo > /dev/tcp/mysql/3306) 2>/dev/null; do echo \"queue: waiting for mysql...\"; sleep 5; done; exec php artisan queue:work --queue=exports,default --sleep=3 --tries=3 --max-time=3600'"
        restart: unless-stopped
    # Dedicated worker for Discogs listing jobs, so throttled bulk listings never wait behind
    # long-running exports (mirrors the prod "laravel-worker-discogs" supervisor program).
    queue-discogs:
        build:
            context: './vendor/laravel/sail/runtimes/8.2'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.2/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - './docker/laravel-custom.ini:/etc/php/8.2/cli/conf.d/99-sail.ini'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
        # See the `queue` service above: block on mysql being reachable so an auto-restarted
        # worker does not flood laravel.log with getaddrinfo stack traces while mysql is down.
        command: "bash -c 'until (echo > /dev/tcp/mysql/3306) 2>/dev/null; do echo \"queue-discogs: waiting for mysql...\"; sleep 5; done; exec php artisan queue:work --queue=discogs --sleep=3 --tries=3 --max-time=3600'"
        restart: unless-stopped
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    phpmyadmin:
        image: 'phpmyadmin:latest'
        ports:
            - 8080:80
        networks:
            - sail
        environment:
            - PMA_ARBITRARY=1
            - UPLOAD_LIMIT=512M
            - PHP_UPLOAD_MAX_FILESIZE=512M
            - PHP_POST_MAX_SIZE=512M
            - PMA_HOST=${DB_HOST}
            - PMA_PORT=${DB_PORT}
            - PMA_USER=${DB_USERNAME}
            - PMA_PASSWORD=${DB_PASSWORD}
        volumes:
            - './docker/phpmyadmin-session.ini:/usr/local/etc/php/conf.d/session.ini'
            - './docker/phpmyadmin-config.user.inc.php:/etc/phpmyadmin/config.user.inc.php'
    # Second app instance used only by the Cypress end to end tests: same code, but its own
    # testing_cypress database (reset by the specs) and the /__cypress__ helper routes enabled,
    # so the specs never touch the dev database. It serves the built assets, run `npm run build`
    # after frontend changes.
    cypress-app:
        image: 'sail-8.2/app'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            APP_ENV: testing
            APP_URL: 'http://cypress-app:8001'
            DB_DATABASE: testing_cypress
            CYPRESS_ROUTES: 'true'
            QUEUE_CONNECTION: database
            DISCOGS_TOKEN: ''
            SENTRY_LARAVEL_DSN: ''
        volumes:
            - '.:/var/www/html'
            - './docker/laravel-custom.ini:/etc/php/8.2/cli/conf.d/99-sail.ini'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
        # --no-reload keeps the environment above instead of re-reading it from .env
        command: "bash -c 'until (echo > /dev/tcp/mysql/3306) 2>/dev/null; do sleep 2; done; mysql -h mysql -u \"${DB_USERNAME}\" -p\"${DB_PASSWORD}\" -e \"CREATE DATABASE IF NOT EXISTS testing_cypress\" && php artisan migrate --force && exec php artisan serve --no-reload --host=0.0.0.0 --port=8001'"
        restart: unless-stopped
    cypress: # run with "sail exec cypress cypress run"
        image: cypress/included:15.17.0
        working_dir: /e2e
        volumes:
            - .:/e2e
        depends_on:
            - cypress-app
        networks:
            - sail
        entrypoint: /bin/sh
        stdin_open: true
        tty: true
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
